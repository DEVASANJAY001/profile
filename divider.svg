<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="400" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00f5ff"/><stop offset="0.35" stop-color="#7c3aed"/><stop offset="0.7" stop-color="#ff5ecb"/><stop offset="1" stop-color="#ffb347"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="800 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="gl" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
